version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/src/"
    schedule:
      interval: "weekly"

  # Actions dos workflows: uma vez por semana, um PR só.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "07:00"
      timezone: America/Cuiaba
    cooldown:
      default-days: 7
    commit-message:
      prefix: actions
    groups:
      actions:
        patterns: ["*"]
